<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCamp: Курс Python в браузере</title>
    <!-- Prism.js для подсветки синтаксиса Python -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <style>
        :root {
            --bg-main: #1e1e1e;
            --bg-panel: #252526;
            --text-main: #cccccc;
            --text-muted: #9cdcfe;
            --accent: #007acc;
            --success: #4ec9b0;
            --border: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            line-height: 1.6; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }
        header { 
            background-color: var(--bg-panel); 
            padding: 1rem 2rem; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        header h1 { font-size: 1.5rem; color: var(--accent); }
        .progress-info { font-size: 0.9rem; color: var(--text-muted); }
        .container { 
            display: grid; 
            grid-template-columns: 2fr 3fr; 
            flex: 1; 
            overflow: hidden; 
            padding: 1rem;
            gap: 1rem;
        }
        .sidebar { 
            background-color: var(--bg-panel); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 1rem; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto;
        }
        .sidebar h3 { margin-bottom: 1rem; color: var(--accent); font-size: 1.1rem; }
        .lesson-list { list-style: none; }
        .lesson-item { 
            padding: 0.5rem 1rem; 
            margin-bottom: 0.5rem; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }
        .lesson-item:hover { background-color: #333; }
        .lesson-item.active { background-color: var(--accent); color: #1e1e1e; }
        .lesson-item.completed { border-left: 3px solid var(--success); }
        .main-content { display: grid; grid-template-rows: 1fr 1fr; gap: 1rem; height: 100%; }
        .panel { 
            background-color: var(--bg-panel); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 1rem; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        .panel h2 { 
            margin-bottom: 1rem; 
            font-size: 1.2rem; 
            color: var(--accent); 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 0.5rem;
        }
        #editor { 
            font-family: 'Fira Code', monospace; 
            font-size: 1rem; 
            background-color: #1e1e1e; 
            color: #d4d4d4; 
            border-radius: 6px; 
            flex: 1; 
            width: 100%; 
            border: 1px solid #333; 
            padding: 1rem; 
            outline: none;
            resize: none;
        }
        #output { 
            background-color: #000; 
            color: #00ff00; 
            font-family: 'Courier New', monospace; 
            border-radius: 6px; 
            padding: 1rem; 
            font-size: 0.95rem; 
            white-space: pre-wrap; 
            word-wrap: break-word;
            overflow-y: auto;
        }
        .controls { 
            display: flex; 
            gap: 1rem; 
            margin-top: 1rem; 
            padding-top: 1rem; 
            border-top: 1px solid var(--border);
        }
        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            padding: 0.7rem 1.5rem; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background-color 0.2s;
        }
        button:hover { background-color: #005a9e; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { flex-direction: row; overflow-x: auto; height: auto; padding: 0.5rem; }
            .lesson-list { display: flex; gap: 0.5rem; }
            .lesson-item { white-space: nowrap; }
            .main-content { grid-template-rows: 1fr 1fr; height: auto; }
        }
    </style>
</head>
<body>

<header>
    <h1>PyCamp: Изучи Python с нуля</h1>
    <div class="progress-info">Урок <span id="current-lesson">1</span> из <span id="total-lessons"></span></div>
</header>

<div class="container">
    <aside class="sidebar">
        <h3>Программа курса</h3>
        <ul id="lesson-list" class="lesson-list"></ul>
    </aside>

    <div class="main-content">
        <div class="panel">
            <h2>Теория</h2>
            <div id="lesson-theory"></div>
        </div>
        
        <div class="panel">
            <h2>Практика</h2>
            <p>Напиши код, чтобы решить задачу урока.</p>
            <textarea id="editor">print("Hello, PyCamp!")</textarea>
            <div class="controls">
                <button id="run-btn">▶ Выполнить код</button>
                <button id="next-btn" disabled>Далее →</button>
            </div>
            <h2 style="margin-top: 1.5rem; font-size: 1.1rem;">Результат (Консоль)</h2>
            <div id="output"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script>
    // === БАЗА ДАННЫХ КУРСА ===
    const lessons = [
        {
            id: 0,
            title: "Вывод данных (print)",
            theory: "Функция <code>print()</code> выводит данные на экран. Это самая первая функция, с которой сталкиваются программисты.",
            task: "Выведи на экран фразу 'Привет, мир!'",
            solution: "print('Привет, мир!')"
        },
        {
            id: 1,
            title: "Переменные и типы данных",
            theory: "Переменные хранят данные. Основные типы: <code>int</code> (целые числа), <code>float</code> (дробные), <code>str</code> (строки). Строки берутся в кавычки.",
            task: "Создай переменную name со своим именем и выведи фразу 'Меня зовут [имя]'",
            solution: "name = 'Алексей'\nprint('Меня зовут', name)"
        },
        {
            id: 2,
            title: "Арифметические операции",
            theory: "Python поддерживает стандартные математические операции: <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> (деление), <code>//</code> (целочисленное деление), <code>%</code> (остаток), <code>**</code> (степень).",
            task: "Создай переменную x = 10. Выведи результат деления x на 4 и остаток от деления x на 3.",
            solution: "x = 10\nprint('Деление:', x / 4)\nprint('Остаток:', x % 3)"
        },
        {
            id: 3,
            title: "Списки (Lists)",
            theory: "Список — это упорядоченная изменяемая коллекция. Создается в квадратных скобках. Элементы можно добавлять (<code>append</code>) и доставать по индексу.",
            task: "Создай список fruits с тремя названиями фруктов. Добавь в конец 'апельсин' и выведи второй элемент списка.",
            solution: "fruits = ['яблоко', 'банан', 'груша']\nfruits.append('апельсин')\nprint(fruits[1])"
        },
        {
            id: 4,
            title: "Условные операторы (if, else)",
            theory: "Конструкция <code>if</code> позволяет выполнять код при выполнении условия. <code>else</code> сработает, если условие ложно.",
            task: "Создай переменную age = 20. Если age больше или равно 18, выведи 'Доступ разрешен', иначе — 'Доступ запрещен'.",
            solution: "age = 20\nif age >= 18:\n    print('Доступ разрешен')\nelse:\n    print('Доступ запрещен')"
        },
        {
            id: 5,
            title: "Цикл for",
            theory: "Цикл <code>for</code> используется для перебора элементов в списке или повторения действия заданное количество раз (<code>range()</code>).",
            task: "Выведи на экран числа от 0 до 4 включительно.",
            solution: "for i in range(5):\n    print(i)"
        },
        {
            id: 6,
            title: "Функции (def)",
            theory: "Функция — это переиспользуемый блок кода. Объявляется через <code>def</code>. Может принимать аргументы и возвращать значение через <code>return</code>.",
            task: "Создай функцию square(n), которая возвращает квадрат числа. Вызови её для числа 5 и выведи результат.",
            solution: "def square(n):\n    return n * n\n\nprint(square(5))"
        }
    ];

    // === СОСТОЯНИЕ ПРИЛОЖЕНИЯ ===
    let currentLessonIndex = 0;
    const editor = document.getElementById('editor');
    const output = document.getElementById('output');
    const runBtn = document.getElementById('run-btn');
    const nextBtn = document.getElementById('next-btn');
    const lessonList = document.getElementById('lesson-list');
    const lessonTheory = document.getElementById('lesson-theory');
    const currentLessonSpan = document.getElementById('current-lesson');
    const totalLessonsSpan = document.getElementById('total-lessons');

    // === ИНИЦИАЛИЗАЦИЯ ===
    function init() {
        totalLessonsSpan.textContent = lessons.length;
        renderLessonList();
        loadFromLocalStorage();
        renderLesson();
    }

    function renderLessonList() {
        lessonList.innerHTML = '';
        lessons.forEach(lesson => {
            const li = document.createElement('li');
            li.classList.add('lesson-item');
            li.textContent = lesson.title;
            li.dataset.id = lesson.id;
            if (lesson.id === currentLessonIndex) li.classList.add('active');
            if (isLessonCompleted(lesson.id)) li.classList.add('completed');
            li.addEventListener('click', () => changeLesson(lesson.id));
            lessonList.appendChild(li);
        });
    }

    function renderLesson() {
        const lesson = lessons[currentLessonIndex];
        currentLessonSpan.textContent = lesson.id + 1;
        lessonTheory.innerHTML = lesson.theory;
        
        // Восстанавливаем код пользователя или показываем задачу
        const savedCode = localStorage.getItem(\`pycamp_code_\${lesson.id}\`);
        editor.value = savedCode || lesson.task;
        
        output.textContent = '';
        // Сбрасываем состояние кнопки "Далее" при каждом рендере
        nextBtn.disabled = !isLessonCompleted(lesson.id);
        
        Prism.highlightElement(editor);
    }

    // === ЛОГИКА ВЫПОЛНЕНИЯ КОДА ===
    function runCode() {
        const lesson = lessons[currentLessonIndex];
        const userCode = editor.value;
        
        // Сохраняем код пользователя в любом случае
        localStorage.setItem(\`pycamp_code_\${lesson.id}\`, userCode);
        output.textContent = '';

        // Изолированная среда выполнения
        const sandbox = {
            print: (...args) => {
                output.textContent += args.join(' ') + '\\n';
            }
        };

        try {
            // Выполняем код пользователя
            const userFunc = new Function('print', `try { ${userCode} } catch(e) { print('Ошибка: ' + e.message); }`);
            userFunc(sandbox.print);

            // Выполняем эталонное решение для получения результата
            const solutionFunc = new Function('print', \`try { \${lesson.solution} } catch(e) { print('Ошибка в эталоне: ' + e.message); }\`);
            solutionFunc(sandbox.print);

            // Если ошибок не было выброшено в консоль, считаем урок пройденным
            if (!output.textContent.includes('Ошибка:')) {
                markAsCompleted(lesson.id);
                nextBtn.disabled = false;
            }
        } catch (e) {
            output.textContent = 'Критическая ошибка выполнения:\\n' + e.message;
            nextBtn.disabled = true;
        } finally {
            Prism.highlightElement(editor);
        }
    }

    // === УПРАВЛЕНИЕ ПРОГРЕССОМ ===
    function markAsCompleted(id) {
        const completed = JSON.parse(localStorage.getItem('pycamp_completed') || '[]');
        if (!completed.includes(id)) {
            completed.push(id);
            localStorage.setItem('pycamp_completed', JSON.stringify(completed));
            renderLessonList();
        }
    }

    function isLessonCompleted(id) {
        const completed = JSON.parse(localStorage.getItem('pycamp_completed') || '[]');
        return completed.includes(id);
    }

    function changeLesson(id) {
        currentLessonIndex = id;
        saveProgress(); // Сохраняем индекс сразу при переключении
        renderLesson();
    }

    function loadFromLocalStorage() {
        const savedIndex = localStorage.getItem('pycamp_lesson_index');
        if (savedIndex !== null) {
            currentLessonIndex = parseInt(savedIndex, 10);
        }
        // Восстанавливаем прогресс пройденных уроков для сайдбара
        renderLessonList();
    }

    function saveProgress() {
        localStorage.setItem('pycamp_lesson_index', currentLessonIndex);
    }

    // === ОБРАБОТЧИКИ СОБЫТИЙ ===
    runBtn.addEventListener('click', runCode);
    
    nextBtn.addEventListener('click', () => {
        if (currentLessonIndex < lessons.length - 1) {
            currentLessonIndex++;
            saveProgress();
            renderLesson();
        }
    });

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
