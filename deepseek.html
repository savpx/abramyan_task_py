<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — интерактивный курс Python</title>
<!-- Skulpt: Python-рантайм в браузере. Интернет нужен только при первом открытии (далее кэшируется). -->
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<style>
/* ============================ I. THEME & BASE ============================ */
:root {
  --bg: #0a0a23;
  --card: #1b1b32;
  --card-2: #2a2a40;
  --border: #3b3b4f;
  --text: #f5f6f7;
  --muted: #9a9ab0;
  --accent: #f1be32;
  --accent-2: #ffcf4d;
  --green: #3ec46d;
  --red: #e5533d;
  --blue: #5b8def;
  --radius: 10px;
  --shadow: 0 4px 18px rgba(0,0,0,.35);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
[data-theme="light"] {
  --bg: #ffffff;
  --card: #f5f5f7;
  --card-2: #e9e9ee;
  --border: #d0d0da;
  --text: #1b1b32;
  --muted: #5c5c72;
  --accent: #d99b00;
  --accent-2: #b98200;
  --shadow: 0 4px 18px rgba(0,0,0,.12);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  transition: background .2s, color .2s;
}
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ============================ II. LAYOUT ============================ */
.app { display: flex; flex-direction: column; height: 100vh; }
.header {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: .3px; }
.brand .logo {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: #1b1b32; font-weight: 900; font-size: 15px;
}
.brand span.accent { color: var(--accent); }
.header-progress { flex: 1 1 auto; max-width: 420px; min-width: 120px; }
.progress-track { height: 8px; background: var(--card-2); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width .3s; }
.progress-label { font-size: 12px; color: var(--muted); margin-top: 3px; }
.header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.streak { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); padding: 4px 8px; border: 1px solid var(--border); border-radius: 99px; }
.btn {
  background: var(--card-2); color: var(--text); border: 1px solid var(--border);
  padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--border); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: #1b1b32; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.layout { display: flex; flex: 1 1 auto; min-height: 0; }

/* ---- Sidebar ---- */
.sidebar {
  width: 280px; flex: 0 0 280px;
  background: var(--card); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 10px;
}
.sidebar-head { display: flex; gap: 6px; margin-bottom: 10px; }
.sidebar-head input {
  flex: 1; background: var(--card-2); border: 1px solid var(--border); color: var(--text);
  padding: 7px 10px; border-radius: 8px; font-size: 13px;
}
.module { margin-bottom: 6px; }
.module-head {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: transparent; border: none; color: var(--text);
  padding: 9px 8px; font-weight: 700; font-size: 13.5px; text-align: left; border-radius: 8px;
}
.module-head:hover { background: var(--card-2); }
.module-head .chev { transition: transform .2s; color: var(--muted); }
.module.collapsed .chev { transform: rotate(-90deg); }
.module.collapsed .lesson-list { display: none; }
.module-count { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; }
.lesson-list { list-style: none; margin: 2px 0 6px; padding: 0 0 0 4px; }
.lesson-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  background: transparent; border: none; color: var(--text);
  padding: 7px 9px; border-radius: 8px; font-size: 13px; text-align: left;
}
.lesson-item:hover { background: var(--card-2); }
.lesson-item.active { background: var(--card-2); box-shadow: inset 2px 0 0 var(--accent); }
.lesson-item.locked { opacity: .5; cursor: not-allowed; }
.status-icon { width: 18px; text-align: center; flex: 0 0 18px; font-size: 13px; }
.status-icon.done { color: var(--green); }
.status-icon.current { color: var(--accent); }
.status-icon.todo { color: var(--muted); }
.status-icon.locked { color: var(--muted); }
.lesson-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- Lesson panel ---- */
.lesson-view { flex: 1 1 1fr; min-width: 0; overflow-y: auto; padding: 22px 28px 60px; }
.lesson-kicker { font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
.lesson-view h1 { font-size: 26px; margin: 6px 0 14px; }
.theory { max-width: 760px; }
.theory p { margin: 0 0 12px; }
.theory code {
  background: var(--card-2); padding: 1px 6px; border-radius: 5px;
  font-family: var(--mono); font-size: .9em; color: var(--accent-2);
}
.theory pre {
  background: #0d1117; color: #e6edf3; border: 1px solid var(--border);
  padding: 12px 14px; border-radius: var(--radius); overflow-x: auto; font-family: var(--mono); font-size: 13.5px;
}
.theory ul { margin: 0 0 12px; padding-left: 22px; }
.task {
  background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--accent);
  padding: 14px 16px; border-radius: var(--radius); margin: 18px 0; max-width: 760px;
}
.task h3 { margin: 0 0 6px; font-size: 15px; color: var(--accent); }
.hints { margin: 12px 0 0; max-width: 760px; }
.hint-item { margin-top: 6px; }
.hint-item summary { cursor: pointer; color: var(--blue); font-size: 13.5px; }
.hint-item p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
.solution-box { margin: 14px 0 0; max-width: 760px; }
.solution-box pre { filter: blur(5px); cursor: pointer; transition: filter .2s; }
.solution-box.revealed pre { filter: none; }

/* ---- Workspace ---- */
.workspace {
  width: 520px; flex: 0 0 520px;
  border-left: 1px solid var(--border); background: var(--card);
  display: flex; flex-direction: column; min-height: 0;
}
.ws-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.ws-toolbar .spacer { flex: 1; }
.editor-wrap { position: relative; flex: 1 1 60%; min-height: 0; display: flex; overflow: hidden; }
.gutter {
  flex: 0 0 auto; padding: 12px 8px 12px 12px; text-align: right; color: var(--muted);
  font-family: var(--mono); font-size: 13.5px; line-height: 1.55; user-select: none;
  background: var(--card-2); overflow: hidden; white-space: pre;
}
#editor {
  flex: 1 1 auto; border: none; resize: none; padding: 12px 14px; background: transparent; color: var(--text);
  font-family: var(--mono); font-size: 13.5px; line-height: 1.55; tab-size: 4; overflow: auto; outline: none; white-space: pre; 
}
.console-wrap { flex: 1 1 40%; min-height: 120px; display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.console-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
#console {
  flex: 1 1 auto; margin: 0; padding: 10px 12px; overflow: auto; background: #0d1117; color: #d9e0e8;
  font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word;
}
#console .err { color: #ff8f7a; }
#console .ok { color: var(--green); }
#console .muted { color: #7d8590; }

/* ---- Tests ---- */
.test-panel { border-top: 1px solid var(--border); padding: 10px 12px; max-height: 34%; overflow-y: auto; }
.test-summary { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.test-summary .pill { padding: 2px 9px; border-radius: 99px; font-size: 12px; background: var(--card-2); }
.pill.pass { background: rgba(62,196,109,.18); color: var(--green); }
.pill.fail { background: rgba(229,83,61,.18); color: var(--red); }
.test-row { display: flex; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed var(--border); font-size: 13px; align-items: flex-start; }
.test-row:last-child { border-bottom: none; }
.test-row .t-icon { flex: 0 0 18px; text-align: center; }
.test-row.pass .t-icon { color: var(--green); }
.test-row.fail .t-icon { color: var(--red); }
.test-row.pending .t-icon { color: var(--muted); }
.test-row .t-msg { color: var(--muted); white-space: pre-wrap; }
.test-row.fail .t-msg { color: var(--text); }

/* ---- Modal ---- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
  align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; max-width: 460px; width: 100%; box-shadow: var(--shadow); }
.modal h2 { margin: 0 0 10px; }
.modal p { color: var(--muted); margin: 0 0 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal .big-emoji { font-size: 40px; text-align: center; margin-bottom: 6px; }

/* ---- Fallback banner ---- */
.banner {
  display: none; padding: 8px 14px; background: rgba(229,83,61,.15); color: #ffb3a3;
  font-size: 13px; border-bottom: 1px solid var(--border);
}
.banner.show { display: block; }

/* ---- Mobile tabs ---- */
.mobile-tabs { display: none; }

/* ============================ III. RESPONSIVE ============================ */
@media (max-width: 1100px) { .workspace { width: 440px; flex-basis: 440px; } }
@media (max-width: 900px) {
  .layout { position: relative; }
  .sidebar {
    position: absolute; inset: 0 auto 0 0; z-index: 30; transform: translateX(-100%);
    transition: transform .22s; box-shadow: var(--shadow); width: 82%; max-width: 320px;
  }
  body.drawer-open .sidebar { transform: translateX(0); }
  .sidebar-scrim { display: none; position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
  body.drawer-open .sidebar-scrim { display: block; }
  .workspace { width: auto; flex-basis: auto; border-left: none; }
  .lesson-view { padding: 16px 18px 60px; }
  .mobile-tabs { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--card); }
  .mobile-tabs .btn { flex: 1; }
  .pane { display: none; }
  body.tab-lesson .pane-lesson,
  body.tab-code .pane-code,
  body.tab-output .pane-output { display: flex; flex-direction: column; }
  body.tab-lesson .pane-lesson { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .pane-lesson .lesson-view { flex: 1 1 auto; }
  .pane-code, .pane-output { flex: 1 1 auto; min-height: 0; }
  .layout.mobile { display: flex; flex-direction: column; }
  .layout.mobile .pane-lesson, .layout.mobile .pane-code, .layout.mobile .pane-output { width: 100%; }
  .menu-btn { display: inline-flex; }
}
.menu-btn { display: none; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <button class="btn ghost menu-btn" id="menuBtn" aria-label="Открыть карту курса">☰</button>
    <div class="brand"><div class="logo">Py</div>Py<span class="accent">Camp</span></div>
    <div class="header-progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">Прогресс: 0 / 0</div>
    </div>
    <div class="header-actions">
      <div class="streak" title="Дней подряд">🔥 <span id="streakCount">0</span></div>
      <button class="btn ghost" id="themeBtn" aria-label="Переключить тему">🌙</button>
      <button class="btn ghost" id="resetBtn" aria-label="Сбросить прогресс">Сброс</button>
    </div>
  </header>
  <div class="banner" id="fallbackBanner">
    ⚠️ Не удалось загрузить Python-рантайм (Skulpt). Возможны только статические проверки. Проверьте интернет и обновите страницу.
  </div>

  <div class="layout" id="layout">
    <div class="sidebar-scrim" id="sidebarScrim"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <input type="search" id="searchBox" placeholder="Поиск урока…" aria-label="Поиск урока">
      </div>
      <nav id="courseMap" aria-label="Карта курса"></nav>
    </aside>

    <div class="mobile-tabs" role="tablist">
      <button class="btn" data-tab="lesson">Урок</button>
      <button class="btn" data-tab="code">Код</button>
      <button class="btn" data-tab="output">Результат</button>
    </div>

    <section class="lesson-view pane pane-lesson" id="lessonView" aria-live="polite"></section>

    <section class="workspace pane pane-code pane-output">
      <div class="ws-toolbar">
        <button class="btn primary" id="runBtn">▶ Запустить <span style="opacity:.7">(Ctrl+Enter)</span></button>
        <button class="btn" id="checkBtn">Проверить</button>
        <div class="spacer"></div>
        <button class="btn" id="resetCodeBtn" title="Вернуть стартовый код">↺ Сброс кода</button>
      </div>
      <div class="editor-wrap">
        <div class="gutter" id="gutter" aria-hidden="true">1</div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Редактор кода"></textarea>
      </div>
      <div class="console-wrap">
        <div class="console-head">Консоль <span id="runStatus"></span></div>
        <pre id="console" tabindex="0"></pre>
      </div>
      <div class="test-panel" id="testPanel"></div>
    </section>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="big-emoji" id="modalEmoji">🎉</div>
    <h2 id="modalTitle">Поздравляем!</h2>
    <p id="modalText">Урок пройден.</p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
/* ========================================================================
   I. DATA — контент курса (инлайн, без внешних JSON)
   ======================================================================== */
const CURRICULUM = [
  {
    id: "m1l1", module: 1, moduleTitle: "Введение",
    title: "Твоя первая программа",
    theory:
      '<p>В Python вывод текста на экран делается функцией <code>print()</code>. ' +
      'Текст (строку) нужно заключить в кавычки, а сам вызов завершить круглыми скобками.</p>' +
      '<pre>print("Привет, мир!")</pre>' +
      '<p>Python выполнит строку и покажет её в консоли. Обратите внимание: кавычки не выводятся — ' +
      'они лишь говорят Python, что это текст.</p>',
    task: 'Выведите строку <code>Hello, PyCamp!</code> с помощью <code>print()</code>.',
    starterCode: 'print("Hello, world!")\n',
    solution: 'print("Hello, PyCamp!")',
    hints: ['Используйте функцию print().', 'Текст заключите в двойные кавычки: "..."'],
    tests: [
      { type: "regex", pattern: "print\\s*\\(", msg: "Используйте функцию print()" },
      { type: "output", expected: "Hello, PyCamp!\n" }
    ]
  },
  {
    id: "m1l2", module: 1, moduleTitle: "Введение",
    title: "Комментарии",
    theory:
      '<p>Комментарии — это заметки для себя и других людей. Python их <strong>игнорирует</strong>. ' +
      'Комментарий начинается с символа <code>#</code> и действует до конца строки.</p>' +
      '<pre># Это комментарий, он не выполняется\nprint("Видно")  # а это видно</pre>',
    task: 'Напишите комментарий (строка, начинающаяся с <code>#</code>), а затем выведите слово <code>Готово</code>.',
    starterCode: '# Напишите комментарий здесь\nprint("...")\n',
    solution: '# Мой первый комментарий\nprint("Готово")',
    hints: ['Комментарий начинается с символа #.', 'Код вывода остаётся без изменения: print("Готово")'],
    tests: [
      { type: "regex", pattern: "^\\s*#", flags: "m", msg: "Добавьте хотя бы один комментарий (#)" },
      { type: "output", expected: "Готово\n" }
    ]
  },
  {
    id: "m1l3", module: 1, moduleTitle: "Введение",
    title: "Несколько строк",
    theory:
      '<p>Один <code>print()</code> выводит одну строку. Чтобы вывести несколько строк, просто напишите ' +
      'несколько вызовов подряд — Python выполнит их сверху вниз.</p>' +
      '<pre>print("Первая")\nprint("Вторая")</pre>',
    task: 'Выведите три строки по порядку: <code>Раз</code>, <code>Два</code>, <code>Три</code>.',
    starterCode: 'print("Раз")\nprint("...")\nprint("...")\n',
    solution: 'print("Раз")\nprint("Два")\nprint("Три")',
    hints: ['Каждая строка — отдельный вызов print().', 'Порядок вызовов = порядок вывода.'],
    tests: [
      { type: "output", expected: "Раз\nДва\nТри\n" },
      { type: "output", input: "", expected: "Раз\nДва\nТри\n" }
    ]
  },
  {
    id: "m1l4", module: 1, moduleTitle: "Введение",
    title: "Числа и вычисления",
    theory:
      '<p>Числа записываются <strong>без кавычек</strong>. Python умеет считать: <code>+</code>, ' +
      '<code>-</code>, <code>*</code>, <code>/</code>.</p>' +
      '<pre>print(2 + 3)\nprint(10 / 2)</pre>' +
      '<p>Результат вычисления тоже можно выводить через <code>print()</code>.</p>',
    task: 'Выведите результат выражения <code>2 + 3</code> (должно получиться <code>5</code>).',
    starterCode: 'print(2 - 3)\n',
    solution: 'print(2 + 3)',
    hints: ['Сложение — это оператор +.', 'Числа пишутся без кавычек: print(2 + 3)'],
    tests: [
      { type: "regex", pattern: "print\\s*\\(", msg: "Используйте print()" },
      { type: "output", expected: "5\n" }
    ]
  },
  {
    id: "m1l5", module: 1, moduleTitle: "Введение",
    title: "Ошибки — это нормально",
    theory:
      '<p>Ошибки (exceptions) — часть работы программиста. Python сообщает, <em>где</em> и <em>что</em> не так. ' +
      'Например, незакрытая кавычка вызовет <code>SyntaxError</code>.</p>' +
      '<pre>print("Привет)   # SyntaxError: незакрытая кавычка</pre>' +
      '<p>Прочитайте сообщение об ошибке — оно почти всегда подсказывает решение.</p>',
    task: 'Исправьте код так, чтобы он вывел <code>Привет</code>.',
    starterCode: 'print("Привет)\n',
    solution: 'print("Привет")',
    hints: ['Проверьте кавычки: нужны и открывающая, и закрывающая.', 'Должно быть print("Привет")'],
    tests: [
      { type: "output", expected: "Привет\n" }
    ]
  },
  {
    id: "m1l6", module: 1, moduleTitle: "Введение",
    title: "Практика: фигура",
    theory:
      '<p>Соберём всё вместе. Используя несколько вызовов <code>print()</code>, можно нарисовать фигуры из символов.</p>' +
      '<pre>print("+")\nprint("++")\nprint("+++")</pre>',
    task: 'Выведите «лесенку» из звёздочек: сначала одна <code>*</code>, затем две <code>**</code>, затем три <code>***</code>.',
    starterCode: 'print("*")\nprint("*")\nprint("*")\n',
    solution: 'print("*")\nprint("**")\nprint("***")',
    hints: ['Каждой строке — свой вызов print().', 'Количество символов * увеличивается на один.'],
    tests: [
      { type: "output", expected: "*\n**\n***\n" }
    ]
  }
];

/* ========================================================================
   II. STATE & STORAGE
   ======================================================================== */
const LS = {
  progress: "pycamp-progress",
  code: "pycamp-code",
  theme: "pycamp-theme",
  streak: "pycamp-streak"
};

const AppState = {
  currentLesson: null,
  progress: {},        // { lessonId: "done" | "in_progress" }
  codeCache: {},       // { lessonId: "code" }
  theme: "dark",
  streak: { lastDate: null, count: 0 },
  storageOk: true
};

function safeGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function safeSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    AppState.storageOk = false;
    return false;
  }
}

function loadProgress() {
  AppState.progress = safeGet(LS.progress, {});
  AppState.codeCache = safeGet(LS.code, {});
  AppState.theme = safeGet(LS.theme, "dark");
  AppState.streak = safeGet(LS.streak, { lastDate: null, count: 0 });
}
function saveProgress() { safeSet(LS.progress, AppState.progress); }
function saveCode() { safeSet(LS.code, AppState.codeCache); }
function saveTheme() { safeSet(LS.theme, AppState.theme); }
function saveStreak() { safeSet(LS.streak, AppState.streak); }

/* ========================================================================
   III. HELPERS
   ======================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function lessonIndex(id) { return CURRICULUM.findIndex(l => l.id === id); }
function modulesOf() {
  const map = new Map();
  for (const l of CURRICULUM) {
    if (!map.has(l.module)) map.set(l.module, { num: l.module, title: l.moduleTitle, lessons: [] });
    map.get(l.module).lessons.push(l);
  }
  return Array.from(map.values());
}

// Разрешённые HTML-теги в теории/задании (простая санитизация).
const ALLOWED_TAGS = new Set(["P","CODE","PRE","STRONG","EM","UL","OL","LI","BR","H3","H4","SPAN"]);
function sanitizeHTML(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  const walk = (node) => {
    Array.from(node.children).forEach((child) => {
      if (!ALLOWED_TAGS.has(child.tagName)) {
        child.replaceWith(...child.childNodes);
      } else {
        Array.from(child.attributes).forEach(a => child.removeAttribute(a.name));
        walk(child);
      }
    });
  };
  walk(tpl.content);
  return tpl.innerHTML;
}

function normalizeOutput(s) {
  return (s || "")
    .replace(/\r\n/g, "\n")
    .split("\n")
    .map(line => line.replace(/\s+$/g, "").replace(/[ \t]+/g, " "))
    .join("\n")
    .trim();
}

/* ========================================================================
   IV. PYTHON RUNNER (Skulpt) + fallback
   ======================================================================== */
const SkulptAvailable = () => (typeof Sk !== "undefined" && Sk && Sk.misceval);
let fallbackMode = false;

function builtinRead(x) {
  if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
    throw new Error("File not found: '" + x + "'");
  }
  return Sk.builtinFiles["files"][x];
}

/**
 * Запускает Python-код в Skulpt.
 * @param {string} code
 * @param {string[]} inputQueue — данные для input()
 * @returns {Promise<{ok:boolean, out:string, err:string}>}
 */
function runPython(code, inputQueue) {
  if (!SkulptAvailable()) {
    fallbackMode = true;
    return Promise.resolve({ ok: false, out: "", err: "__NO_SKULPT__" });
  }
  let out = "";
  let err = "";
  const queue = (inputQueue || []).slice();
  try {
    Sk.execLimit = 5000; // 5 сек на прогон
    Sk.configure({
      output: (t) => { out += t; },
      read: builtinRead,
      inputfun: () => (queue.length ? queue.shift() : ""),
      inputfunTakesPrompt: true,
      __future__: Sk.python3
    });
  } catch (e) {
    return Promise.resolve({ ok: false, out, err: String(e) });
  }
  return Sk.misceval
    .asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
    .then(() => ({ ok: true, out, err: "" }))
    .catch((e) => {
      err = (e && e.toString) ? e.toString() : String(e);
      return { ok: false, out, err };
    });
}

function queueFromInput(input) {
  if (!input) return [];
  return input.replace(/\n$/, "").split("\n");
}

/* ========================================================================
   V. CHECKER — три уровня тестов
   ======================================================================== */
async function checkLesson(lesson) {
  const code = editor.value;
  const tests = lesson.tests || [];
  const results = new Array(tests.length);

  for (let i = 0; i < tests.length; i++) {
    const t = tests[i];

    // Уровень 1 — regex (без выполнения)
    if (t.type === "regex") {
      let pass = false;
      try { pass = new RegExp(t.pattern, t.flags || "").test(code); } catch (e) { pass = false; }
      results[i] = {
        type: "regex", pass,
        msg: pass ? "Статическая проверка пройдена" : (t.msg || "Паттерн не найден: " + t.pattern)
      };

    // Уровень 2 — сравнение вывода
    } else if (t.type === "output") {
      const r = await runPython(code, queueFromInput(t.input));
      const got = normalizeOutput(r.out);
      const exp = normalizeOutput(t.expected);
      const pass = r.ok && got === exp;
      let msg = pass ? "Вывод совпал" : ("Ожидалось:\n«" + exp + "»\nПолучено:\n«" + got + "»");
      if (!r.ok && r.err && r.err !== "__NO_SKULPT__") msg += "\nОшибка: " + r.err;
      if (!r.ok && r.err === "__NO_SKULPT__") msg = "Python-рантайм недоступен — проверка вывода пропущена";
      results[i] = { type: "output", pass, msg };

    // Уровень 3 — unit-тесты (изолированный прогон + harness)
    } else if (t.type === "unit") {
      const harness = "\n\n# --- hidden tests ---\n" + t.code + "\nprint('__HARNESS_OK__')\n";
      const r = await runPython(code + harness, []);
      const pass = r.ok && r.out.indexOf("__HARNESS_OK__") !== -1;
      let msg = pass ? "Unit-тест пройден" : (t.msg || "Unit-тест не пройден");
      if (!r.ok && r.err && r.err !== "__NO_SKULPT__") msg += "\n" + r.err;
      if (!r.ok && r.err === "__NO_SKULPT__") msg = "Python-рантайм недоступен — unit-тест пропущен";
      results[i] = { type: "unit", pass, msg };

    // Анти-читинг — разные входы должны давать разный вывод
    } else if (t.type === "no-hardcode") {
      const a = await runPython(code, queueFromInput(t.inputA));
      const b = await runPython(code, queueFromInput(t.inputB));
      const pass = (a.out !== b.out);
      results[i] = {
        type: "no-hardcode", pass,
        msg: pass ? "Ответ не захардкожен" : "Похоже, ответ захардкожен — он не зависит от ввода"
      };
    }
  }

  return results;
}

/* ========================================================================
   VI. RENDER
   ======================================================================== */
const els = {
  sidebar: $("#sidebar"),
  courseMap: $("#courseMap"),
  lessonView: $("#lessonView"),
  editor: $("#editor"),
  gutter: $("#gutter"),
  console: $("#console"),
  testPanel: $("#testPanel"),
  progressFill: $("#progressFill"),
  progressLabel: $("#progressLabel"),
  streakCount: $("#streakCount"),
  modal: $("#modal"),
  modalEmoji: $("#modalEmoji"),
  modalTitle: $("#modalTitle"),
  modalText: $("#modalText"),
  modalActions: $("#modalActions"),
  fallbackBanner: $("#fallbackBanner"),
  runStatus: $("#runStatus"),
  searchBox: $("#searchBox")
};

function lessonStatus(l) {
  if (AppState.progress[l.id] === "done") return "done";
  return "todo";
}

function isUnlocked(index) {
  if (index === 0) return true;
  const prev = CURRICULUM[index - 1];
  return prev ? AppState.progress[prev.id] === "done" : true;
}

function renderCourseMap(filter) {
  const f = (filter || "").trim().toLowerCase();
  const nav = els.courseMap;
  nav.innerHTML = "";
  for (const mod of modulesOf()) {
    const lessons = f ? mod.lessons.filter(l => l.title.toLowerCase().includes(f)) : mod.lessons;
    if (f && lessons.length === 0) continue;

    const modEl = document.createElement("div");
    modEl.className = "module";

    const head = document.createElement("button");
    head.className = "module-head";
    head.innerHTML = '<span class="chev">▾</span> <span>M' + mod.num + '. ' + mod.title + '</span>' +
      '<span class="module-count">' + mod.lessons.filter(l => lessonStatus(l) === "done").length + '/' + mod.lessons.length + '</span>';
    head.addEventListener("click", () => modEl.classList.toggle("collapsed"));
    modEl.appendChild(head);

    const list = document.createElement("ul");
    list.className = "lesson-list";
    for (const l of lessons) {
      const idx = lessonIndex(l.id);
      const status = lessonStatus(l);
      const unlocked = isUnlocked(idx);
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "lesson-item" +
        (l.id === AppState.currentLesson ? " active" : "") +
        (!unlocked ? " locked" : "");
      let icon = "○", cls = "todo";
      if (status === "done") { icon = "✓"; cls = "done"; }
      else if (l.id === AppState.currentLesson) { icon = "●"; cls = "current"; }
      if (!unlocked) { icon = "🔒"; cls = "locked"; }
      btn.innerHTML = '<span class="status-icon ' + cls + '">' + icon + '</span>' +
        '<span class="lesson-title">' + l.title + '</span>';
      btn.addEventListener("click", () => {
        if (!unlocked) { toast("Сначала пройдите предыдущий урок"); return; }
        navigateTo(l.id);
        document.body.classList.remove("drawer-open");
      });
      li.appendChild(btn);
      list.appendChild(li);
    }
    modEl.appendChild(list);
    nav.appendChild(modEl);
  }
}

function renderLesson(lesson) {
  AppState.currentLesson = lesson.id;
  const status = lessonStatus(lesson);

  els.lessonView.innerHTML =
    '<div class="lesson-kicker">Модуль ' + lesson.module + ' · ' + lesson.moduleTitle + '</div>' +
    '<h1>' + lesson.title + '</h1>' +
    '<div class="theory">' + sanitizeHTML(lesson.theory) + '</div>' +
    '<div class="task"><h3>Задание</h3><div>' + sanitizeHTML(lesson.task) + '</div></div>' +
    renderHints(lesson) +
    renderSolution(lesson);

  // editor value: кэш кода или стартовый код
  editor.value = AppState.codeCache[lesson.id] != null ? AppState.codeCache[lesson.id] : lesson.starterCode;
  updateGutter();
  clearConsole();
  resetTestPanel(lesson);
  renderCourseMap(els.searchBox.value);
  updateProgress();
  els.lessonView.scrollTop = 0;

  // Событие раскрытия решения
  const solBox = $(".solution-box", els.lessonView);
  if (solBox) solBox.addEventListener("click", () => solBox.classList.add("revealed"));
}

function renderHints(lesson) {
  if (!lesson.hints || !lesson.hints.length) return "";
  let html = '<details class="hints"><summary>💡 Подсказки (' + lesson.hints.length + ')</summary>';
  lesson.hints.forEach((h, i) => {
    html += '<details class="hint-item"><summary>Подсказка ' + (i + 1) + '</summary><p>' + sanitizeHTML(h) + '</p></details>';
  });
  return html + '</details>';
}

function renderSolution(lesson) {
  if (!lesson.solution) return "";
  return '<div class="solution-box" title="Кликните, чтобы раскрыть">' +
    '<div style="font-size:13px;color:var(--muted);margin-bottom:4px">Решение (нажмите, чтобы показать)</div>' +
    '<pre>' + lesson.solution.replace(/</g, "<") + '</pre></div>';
}

function resetTestPanel(lesson) {
  const tests = lesson.tests || [];
  if (!tests.length) { els.testPanel.innerHTML = ""; return; }
  els.testPanel.innerHTML =
    '<div class="test-summary">Тесты <span class="pill" id="testPill">0 / ' + tests.length + '</span></div>' +
    '<div id="testRows">' + tests.map((t, i) =>
      '<div class="test-row pending" data-i="' + i + '"><span class="t-icon">○</span>' +
      '<span class="t-msg">' + testLabel(t) + '</span></div>').join("") +
    '</div>';
}

function testLabel(t) {
  switch (t.type) {
    case "regex": return "Проверка кода: " + (t.msg || t.pattern);
    case "output": return "Ожидаемый вывод";
    case "unit": return "Скрытый тест" + (t.msg ? ": " + t.msg : "");
    case "no-hardcode": return "Ответ зависит от данных";
    default: return t.type;
  }
}

function renderTestResults(lesson, results) {
  const rows = $$("#testRows .test-row");
  let passed = 0;
  results.forEach((r, i) => {
    const row = rows[i];
    if (!row) return;
    row.classList.remove("pending", "pass", "fail");
    row.classList.add(r.pass ? "pass" : "fail");
    row.querySelector(".t-icon").textContent = r.pass ? "✓" : "✗";
    row.querySelector(".t-msg").textContent = r.msg;
    if (r.pass) passed++;
  });
  const pill = $("#testPill");
  pill.textContent = passed + " / " + (lesson.tests || []).length;
  pill.classList.toggle("pass", passed === (lesson.tests || []).length);
  pill.classList.toggle("fail", passed !== (lesson.tests || []).length);
  return passed;
}

function updateProgress() {
  const done = CURRICULUM.filter(l => AppState.progress[l.id] === "done").length;
  const total = CURRICULUM.length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  els.progressFill.style.width = pct + "%";
  els.progressLabel.textContent = "Прогресс: " + done + " / " + total + " (" + pct + "%)";
}

/* ========================================================================
   VII. EDITOR (textarea + gutter + Tab)
   ======================================================================== */
const editor = els.editor;
let lineCount = 1;

function updateGutter() {
  lineCount = editor.value.split("\n").length;
  let g = "";
  for (let i = 1; i <= lineCount; i++) g += i + "\n";
  els.gutter.textContent = g;
  syncGutterScroll();
}
function syncGutterScroll() {
  els.gutter.scrollTop = editor.scrollTop;
}
editor.addEventListener("input", () => {
  updateGutter();
  if (AppState.currentLesson) {
    AppState.codeCache[AppState.currentLesson] = editor.value;
    saveCode();
  }
});
editor.addEventListener("scroll", syncGutterScroll);
editor.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const start = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.slice(0, start) + "    " + editor.value.slice(end);
    editor.selectionStart = editor.selectionEnd = start + 4;
    updateGutter();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    runCurrent();
  }
});

/* ========================================================================
   VIII. CONSOLE
   ======================================================================== */
const MAX_CONSOLE_LINES = 2000;
function clearConsole() { els.console.innerHTML = ""; appendConsole("PyCamp — готово к запуску. Нажмите «Запустить».", "muted"); }
function appendConsole(text, cls) {
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  els.console.appendChild(span);
  // Ограничение по числу строк
  const text2 = els.console.textContent;
  const lines = text2.split("\n");
  if (lines.length > MAX_CONSOLE_LINES) {
    els.console.textContent = lines.slice(lines.length - MAX_CONSOLE_LINES).join("\n");
  }
  els.console.scrollTop = els.console.scrollHeight;
}

/* ========================================================================
   IX. ACTIONS
   ======================================================================== */
function currentLesson() { return CURRICULUM[lessonIndex(AppState.currentLesson)] || CURRICULUM[0]; }

async function runCurrent() {
  const lesson = currentLesson();
  clearConsole();
  els.runStatus.textContent = "выполняется…";
  // Для уроков с input — подставим первый output-тест input, если есть
  const inputTest = (lesson.tests || []).find(t => t.type === "output" && t.input);
  const queue = inputTest ? queueFromInput(inputTest.input) : [];
  const r = await runPython(editor.value, queue);
  if (r.out) appendConsole(r.out);
  if (!r.ok && r.err) {
    if (r.err === "__NO_SKULPT__") {
      appendConsole("⚠️ Python-рантайм недоступен. Только статические проверки.\n", "err");
    } else {
      appendConsole("\n" + r.err, "err");
    }
  }
  if (r.ok && !r.out) appendConsole("(нет вывода)\n", "muted");
  els.runStatus.textContent = r.ok ? "✓ завершено" : "✗ ошибка";
}

async function checkCurrent() {
  const lesson = currentLesson();
  els.runStatus.textContent = "проверка…";
  const results = await checkLesson(lesson);
  const passed = renderTestResults(lesson, results);
  const total = (lesson.tests || []).length;
  els.runStatus.textContent = passed + "/" + total + " тестов";

  if (passed === total && total > 0) {
    AppState.progress[lesson.id] = "done";
    saveProgress();
    renderCourseMap(els.searchBox.value);
    updateProgress();
    markStreak();
    openSuccessModal(lesson);
  } else {
    if (AppState.progress[lesson.id] !== "done") AppState.progress[lesson.id] = "in_progress";
    saveProgress();
    renderCourseMap(els.searchBox.value);
  }
}

function resetEditor() {
  const lesson = currentLesson();
  editor.value = lesson.starterCode;
  AppState.codeCache[lesson.id] = editor.value;
  saveCode();
  updateGutter();
  clearConsole();
  resetTestPanel(lesson);
}

function nextLesson() {
  const idx = lessonIndex(AppState.currentLesson);
  if (idx < CURRICULUM.length - 1) navigateTo(CURRICULUM[idx + 1].id);
  closeModal();
}

/* ========================================================================
   X. MODAL
   ======================================================================== */
function openModal({ emoji, title, text, actions }) {
  els.modalEmoji.textContent = emoji || "";
  els.modalEmoji.style.display = emoji ? "block" : "none";
  els.modalTitle.textContent = title;
  els.modalText.textContent = text;
  els.modalActions.innerHTML = "";
  (actions || []).forEach(a => {
    const b = document.createElement("button");
    b.className = "btn " + (a.primary ? "primary" : "");
    b.textContent = a.label;
    b.addEventListener("click", a.onClick);
    els.modalActions.appendChild(b);
  });
  els.modal.classList.add("open");
}
function closeModal() { els.modal.classList.remove("open"); }

function openSuccessModal(lesson) {
  const idx = lessonIndex(lesson.id);
  const isLast = idx === CURRICULUM.length - 1;
  openModal({
    emoji: "🎉",
    title: "Урок пройден!",
    text: "Отличная работа. Продолжайте в том же духе.",
    actions: [
      { label: "Закрыть", onClick: closeModal },
      { label: isLast ? "К началу" : "Далее →", primary: true, onClick: nextLesson }
    ]
  });
}

function toast(text) {
  appendConsole(text + "\n", "muted");
}

/* ========================================================================
   XI. STREAK
   ======================================================================== */
function todayStr() { return new Date().toISOString().slice(0, 10); }
function markStreak() {
  const today = todayStr();
  const s = AppState.streak;
  if (s.lastDate === today) return;
  const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  s.count = (s.lastDate === y) ? (s.count + 1) : 1;
  s.lastDate = today;
  saveStreak();
  renderStreak();
}
function renderStreak() { els.streakCount.textContent = AppState.streak.count || 0; }

/* ========================================================================
   XII. THEME
   ======================================================================== */
function applyTheme() {
  document.documentElement.dataset.theme = AppState.theme;
  $("#themeBtn").textContent = AppState.theme === "dark" ? "🌙" : "☀️";
}
function toggleTheme() {
  AppState.theme = AppState.theme === "dark" ? "light" : "dark";
  saveTheme();
  applyTheme();
}

/* ========================================================================
   XIII. ROUTER & EVENTS
   ======================================================================== */
function navigateTo(id) {
  location.hash = "#/lesson/" + id;
}
function onRoute() {
  const m = location.hash.match(/#\/lesson\/([\w-]+)/);
  const id = m ? m[1] : CURRICULUM[0].id;
  const lesson = CURRICULUM[lessonIndex(id)] || CURRICULUM[0];
  renderLesson(lesson);
}
window.addEventListener("hashchange", onRoute);

/* ---- Header actions ---- */
$("#themeBtn").addEventListener("click", toggleTheme);
$("#resetBtn").addEventListener("click", () => {
  openModal({
    emoji: "⚠️",
    title: "Сбросить прогресс?",
    text: "Весь прогресс и сохранённый код будут удалены. Это действие необратимо.",
    actions: [
      { label: "Отмена", onClick: closeModal },
      { label: "Сбросить", primary: true, onClick: () => {
        try { localStorage.removeItem(LS.progress); localStorage.removeItem(LS.code); } catch (e) {}
        AppState.progress = {}; AppState.codeCache = {};
        closeModal();
        renderLesson(currentLesson());
        renderCourseMap("");
        updateProgress();
      }}
    ]
  });
});
$("#menuBtn").addEventListener("click", () => document.body.classList.toggle("drawer-open"));
$("#sidebarScrim").addEventListener("click", () => document.body.classList.remove("drawer-open"));
els.searchBox.addEventListener("input", () => renderCourseMap(els.searchBox.value));

/* ---- Workspace actions ---- */
$("#runBtn").addEventListener("click", runCurrent);
$("#checkBtn").addEventListener("click", checkCurrent);
$("#resetCodeBtn").addEventListener("click", resetEditor);

/* ---- Mobile tabs ---- */
$$(".mobile-tabs .btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.body.classList.remove("tab-lesson", "tab-code", "tab-output");
    document.body.classList.add("tab-" + btn.dataset.tab);
    $$(".mobile-tabs .btn").forEach(b => b.style.background = "");
    btn.style.background = "var(--accent)";
    btn.style.color = "#1b1b32";
  });
});

/* ---- Modal close on backdrop ---- */
els.modal.addEventListener("click", (e) => { if (e.target === els.modal) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

/* ========================================================================
   XIV. BOOTSTRAP
   ======================================================================== */
function setupResponsive() {
  const mq = window.matchMedia("(max-width: 900px)");
  const apply = () => {
    const mobile = mq.matches;
    document.body.classList.toggle("mobile", mobile);
    $("#layout").classList.toggle("mobile", mobile);
    if (mobile) {
      document.body.classList.add("tab-lesson");
    } else {
      document.body.classList.remove("tab-lesson", "tab-code", "tab-output");
    }
  };
  mq.addEventListener ? mq.addEventListener("change", apply) : mq.addListener(apply);
  apply();
}

function init() {
  loadProgress();
  applyTheme();
  renderStreak();
  markStreak();
  setupResponsive();
  renderCourseMap("");
  updateProgress();
  onRoute();

  if (!SkulptAvailable()) {
    els.fallbackBanner.classList.add("show");
    setTimeout(() => {
      if (!SkulptAvailable()) els.fallbackBanner.classList.add("show");
    }, 1500);
  }
  window.addEventListener("load", () => {
    if (!SkulptAvailable()) els.fallbackBanner.classList.add("show");
  });
}

init();
</script>
